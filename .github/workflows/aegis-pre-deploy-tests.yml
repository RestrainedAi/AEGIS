name: AEGIS pre-deploy tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pre-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install viewer dependencies
        working-directory: suno-viewer
        run: npm ci

      - name: Run pre-deploy test suite
        working-directory: test
        run: npm run test:pre-deploy
