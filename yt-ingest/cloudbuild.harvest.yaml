steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/stable-framing-482501-t9/aeonimus-repo/harvest-job:latest'
      - '-f'
      - 'Dockerfile.harvest'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/stable-framing-482501-t9/aeonimus-repo/harvest-job:latest'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
timeout: '1200s'
